name: Build SA-MP 2.10 APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK & CMake
        run: |
          echo "Accepting Android Licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing NDK and CMake..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle script executable
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle_build.log || {
            echo ""
            echo "==================== [ WHAT WENT WRONG ] ===================="
            grep -A 25 "\* What went wrong:" gradle_build.log || true
            echo ""
            echo "==================== [ LAST 40 LINES ] ===================="
            grep -B 40 "BUILD FAILED" gradle_build.log || true
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: samp-2.10-apk
          path: |
            app/build/outputs/apk/**/*.apk
            gradle_build.log
          retention-days: 14
